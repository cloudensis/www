name: Preview

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # フォークからの PR ではシークレットを参照できないため実行しない
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - run: npm ci

      - run: npm run build

      # Preview alias は DNS ラベルとして使われるため、英小文字・数字・ハイフンのみにする
      - id: alias
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            alias="pr-${PR_NUMBER}"
          else
            alias=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//' | cut -c1-40 | sed -E 's/-+$//')
          fi
          echo "name=${alias}" >> "$GITHUB_OUTPUT"

      - id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.alias.outputs.name }} --message "${{ github.sha }}"

      - id: url
        env:
          OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          alias_url=$(echo "$OUTPUT" | grep -oE 'Version Preview Alias URL: https://[^ ]+' | sed 's/^.*: //')
          version_url=$(echo "$OUTPUT" | grep -oE 'Version Preview URL: https://[^ ]+' | sed 's/^.*: //')
          echo "alias=${alias_url}" >> "$GITHUB_OUTPUT"
          echo "version=${version_url}" >> "$GITHUB_OUTPUT"
          {
            echo "## Preview"
            echo ""
            echo "- Alias: ${alias_url}"
            echo "- Version: ${version_url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          ALIAS_URL: ${{ steps.url.outputs.alias }}
          VERSION_URL: ${{ steps.url.outputs.version }}
        with:
          script: |
            const marker = "<!-- workers-preview -->";
            const body = [
              marker,
              "## Preview",
              "",
              `- Alias: ${process.env.ALIAS_URL}`,
              `- Version: ${process.env.VERSION_URL}`,
              `- Commit: ${context.sha}`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
