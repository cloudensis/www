name: Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - run: npm ci

      # 静的ページ（public/index.html と public/assets/）を先に生成する。
      # cf は内部で Vite の Worker ビルドのみを行い、public/ をアセットとして
      # 取り込むため、SSG ビルドはこのステップで済ませておく必要がある。
      - run: npm run build:ssg

      - run: npx cf deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
